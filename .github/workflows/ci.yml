# Acme.Service CI (plan P22). Enforces every quality gate on pull requests and on main.
# Supply chain: every action is pinned to a full commit SHA (version in the trailing comment); every downloaded tool
# and container image is pinned by version AND checksum/digest. Dependabot (.github/dependabot.yml) bumps the actions.
# Secrets: this workflow uses no repository secrets (INV-11). Nothing is pushed to a registry (OQ-06).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  SOLUTION: Acme.Service.slnx

jobs:
  build-test:
    name: Build, format, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 2. .NET SDK from global.json
      - name: Set up .NET SDK (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # 3. NuGet package cache keyed on the committed lock files
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # 4. locked restore (INV-20): fails if any packages.lock.json is out of date
      - name: Restore (locked mode)
        run: dotnet restore "$SOLUTION" --locked-mode

      # 5. Release build; warnings are errors via Directory.Build.props (INV-21)
      - name: Build (Release)
        run: dotnet build "$SOLUTION" -c Release --no-restore

      # 6. formatting/style gate (INV-21)
      - name: Verify formatting
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      # 7. unit + architecture tests (state.md toolchain record, plus logger/coverage flags)
      - name: Unit and architecture tests
        run: >-
          dotnet test "$SOLUTION" -c Release --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFilePrefix=unit"
          --collect "XPlat Code Coverage"
          --results-directory TestResults/unit

      # 8. integration tests (Testcontainers on the hosted runner's Docker). One retry for flaky container
      #    start-up; a retry is reported as a warning annotation and in the job summary, never hidden.
      - name: Integration tests (one reported retry)
        run: |
          run_integration() {
            dotnet test "$SOLUTION" -c Release --no-build \
              --filter "Category=Integration" \
              --logger "trx;LogFilePrefix=integration" \
              --collect "XPlat Code Coverage" \
              --results-directory "TestResults/integration-attempt-$1"
          }
          if run_integration 1; then
            exit 0
          fi
          echo "::warning title=Integration tests retried::Attempt 1 failed; retrying once. Investigate flakiness (TRX for both attempts is in the test-results artifact)."
          {
            echo "### Integration tests retried"
            echo "Attempt 1 failed and the suite was re-run once. Both attempts' TRX files are in the \`test-results\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          run_integration 2

      # 9. vulnerable packages, direct and transitive; fails on High/Critical (WH-31)
      - name: Vulnerable package scan
        run: scripts/ci/check-vulnerable.sh "$SOLUTION"

      # 10. test results and coverage
      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  secrets-scan:
    name: Secrets scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks CLI container, not gitleaks-action (WH-30: the action needs a licence key for org repos).
      - name: gitleaks (all commits)
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner

  docker:
    name: Docker image (build, non-root, Trivy, history)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: acme-service:${{ github.sha }}
      TRIVY_VERSION: "0.75.0"
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the image runs as a non-root user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          echo "Config.User='${user}'"
          name="${user%%:*}"
          if [[ -z "$name" || "$name" == "0" || "$name" == "root" ]]; then
            echo "::error title=Root container::The image user is '${user:-<unset>}'; the runtime stage must set a non-root USER."
            exit 1
          fi

      - name: Install Trivy (pinned, checksum-verified)
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Trivy image scan (HIGH/CRITICAL with a fix available)
        run: |
          trivy --version
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE"

      # INV-11: no secret may be baked into a layer, build arg or ENV.
      - name: Assert no secrets in docker history
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: |
          history_file="$RUNNER_TEMP/image-history.txt"
          {
            docker history --no-trunc --format '{{.CreatedBy}}' "$IMAGE"
            docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE"
          } > "$history_file"
          cat "$history_file"
          if grep -Ein '(password|passwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key|client[_-]?secret|connectionstrings?__)[A-Za-z0-9_]*[[:space:]]*=' "$history_file"; then
            echo "::error title=Secret in image history::A secret-like assignment appears in the image history or ENV (INV-11)."
            exit 1
          fi
          docker run --rm -i -v "$GITHUB_WORKSPACE/.gitleaks.toml:/cfg/.gitleaks.toml:ro" "$GITLEAKS_IMAGE" \
            stdin --config /cfg/.gitleaks.toml --redact --no-banner < "$history_file"

  k8s-manifests:
    name: Kubernetes manifests (kustomize + kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUSTOMIZE_VERSION: "5.8.3"
      KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
      KUBECONFORM_VERSION: "0.8.0"
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kustomize and kubeconform (pinned, checksum-verified)
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"

          kustomize_tgz="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$kustomize_tgz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/${kustomize_tgz}"
          echo "${KUSTOMIZE_SHA256}  $RUNNER_TEMP/$kustomize_tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$kustomize_tgz" -C "$bin" kustomize

          kubeconform_tgz="kubeconform-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$kubeconform_tgz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${kubeconform_tgz}"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/$kubeconform_tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$kubeconform_tgz" -C "$bin" kubeconform

          echo "$bin" >> "$GITHUB_PATH"
          "$bin/kustomize" version
          "$bin/kubeconform" -v

      - name: Validate overlays
        run: scripts/ci/validate-k8s.sh

  # ---------------------------------------------------------------------------------------------------------------
