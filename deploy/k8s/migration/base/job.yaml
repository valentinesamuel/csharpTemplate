# Applies every module's EF migrations, the Hangfire schema and the Auth seed, then exits (INV-16).
# Jobs are immutable: delete the previous run before applying (see deploy/k8s/README.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: acme-service-migrate
  labels:
    app.kubernetes.io/name: acme-service
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acme-service
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: acme-service
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: acme-service-migrate-config
          env:
            # Same runtime connection string as the app (Secret acme-service-secrets, created externally).
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: acme-service-secrets
                  key: ConnectionStrings__Postgres
            # Privileged DDL connection string, only ever given to this Job (created externally).
            - name: ConnectionStrings__PostgresMigrations
              valueFrom:
                secretKeyRef:
                  name: acme-service-migrations-secrets
                  key: ConnectionStrings__PostgresMigrations
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
