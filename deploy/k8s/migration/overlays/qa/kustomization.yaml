# Migration Job, qa environment. Apply BEFORE the app overlay and wait for completion (see deploy/k8s/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: acme-service-qa

labels:
  - pairs:
      app.kubernetes.io/instance: acme-service-qa
    includeSelectors: false
    includeTemplates: true

resources:
  - ../../base

# Must match the app image tag in deploy/k8s/overlays/qa.
images:
  - name: acme-service
    newName: registry.example.com/your-org/acme-service
    newTag: "qa"

# Same Jobs__Provider as deploy/k8s/overlays/qa/config-patch.yaml.
configMapGenerator:
  - name: acme-service-migrate-config
    behavior: merge
    literals:
      - Jobs__Provider=Hangfire

patches:
  - target:
      kind: Job
      name: acme-service-migrate
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
