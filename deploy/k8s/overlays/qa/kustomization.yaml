# Acme.Service web app, qa environment. Apply AFTER the migration Job completed (see deploy/k8s/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: acme-service-qa

labels:
  - pairs:
      app.kubernetes.io/instance: acme-service-qa
    includeSelectors: false
    includeTemplates: true

resources:
  - ../../base

images:
  - name: acme-service
    newName: registry.example.com/your-org/acme-service
    newTag: "qa"

replicas:
  - name: acme-service
    count: 2

patches:
  - path: config-patch.yaml
  - path: deployment-patch.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: acme-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
