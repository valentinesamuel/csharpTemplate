apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-service
spec:
  template:
    spec:
      containers:
        - name: acme-service
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      # Spread replicas across zones (best effort) and never co-locate two on one node when avoidable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: acme-service
              app.kubernetes.io/component: api
          matchLabelKeys:
            - pod-template-hash
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: acme-service
              app.kubernetes.io/component: api
          matchLabelKeys:
            - pod-template-hash
