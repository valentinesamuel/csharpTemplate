# Non-secret configuration only (INV-11). Keys are .NET configuration paths with ':' written as '__'.
# Credentials (connection strings, Redis/S3/SMTP secrets) come from Secret acme-service-secrets; the JWT private key is
# a file mounted from Secret acme-service-jwt-keys. Overlays patch the provider and environment-specific values.
# Do not set Blob__Provider=Local: the root filesystem is read-only and D-21 rejects it in Production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: acme-service-config
  labels:
    app.kubernetes.io/name: acme-service
data:
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_gcServer: "1"

  # Providers (D-21: dev-only providers fail startup in Production).
  Cache__Provider: Redis
  Blob__Provider: S3
  Notifications__Provider: Smtp
  Jobs__Provider: Hangfire
  Locks__Provider: Postgres

  # JWT signing key ring: the key material is the mounted file, never an env var.
  Auth__Jwt__SigningKeys__0__Kid: signing-key-0
  Auth__Jwt__SigningKeys__0__Status: Active
  Auth__Jwt__SigningKeys__0__PrivateKeyPath: /etc/acme-service/jwt/signing-key-0.pem

  # Absolute front-end URLs placed in emails (overlays set per-environment values).
  Auth__Links__ConfirmEmailUrl: https://app.example.com/confirm-email
  Auth__Links__ResetPasswordUrl: https://app.example.com/reset-password

  # Empty disables OTLP export.
  Observability__Otlp__Endpoint: ""
