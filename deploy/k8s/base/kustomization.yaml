# Base for the Acme.Service web app (plan P21). Not applied directly: use deploy/k8s/overlays/<env>.
# Secrets are referenced, never defined here (INV-11): acme-service-secrets and acme-service-jwt-keys are created
# out of band (see deploy/k8s/README.md). Schema changes run in the separate migration Job (INV-16).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: acme-service
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
# The image tag is set by each overlay via `images:` (name acme-service).
